<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- MANDATORY per Modern Web Guidance: declare light dark color schemes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // FOUC prevention: set color-scheme and dark class from localStorage before render
      try {
        const storedTheme = localStorage.getItem('tipkur-theme') || 'system';
        const isDark = storedTheme === 'dark' || (storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) {
          meta.content = storedTheme === 'system' ? 'light dark' : storedTheme;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Tipkur Tipkha — Khasi Clan Genealogy & Kinship Checker</title>
    <!-- Google Fonts for Khasi Heritage typography: Playfair Display for classic headings, Plus Jakarta Sans for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400..700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-white text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
